<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公文 PDF → Markdown</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #fff;
    --ink: #1c1c1a;
    --muted: #6b6b66;
    --line: #dcdcd6;
    --accent: #2f5d50;
    --danger: #a33;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1a18; --card:#232320; --ink:#eceae4; --muted:#9b9b93; --line:#39392f; --accent:#7fb8a4; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: var(--bg); color: var(--ink);
    font: 15px/1.65 system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
  #drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 2.5rem 1rem;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #drop strong { display: block; font-size: 1.05rem; margin-bottom: .35rem; }
  #drop span { color: var(--muted); font-size: .875rem; }
  .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
  label { color: var(--muted); font-size: .875rem; }
  input[type=text] {
    flex: 1; min-width: 12rem; padding: .5rem .65rem; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: .9rem;
  }
  button {
    padding: .55rem 1.1rem; border: 0; border-radius: 6px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 500; }
  #status { display: none; }
  #status.on { display: block; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: .75rem; }
  .bar i { display: block; height: 100%; width: 35%; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .meta { color: var(--muted); font-size: .85rem; margin-top: .4rem; }
  .err { color: var(--danger); white-space: pre-wrap; }
  pre {
    max-height: 26rem; overflow: auto; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: .9rem; font-size: .82rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  #result { display: none; }
  #result.on { display: block; }
</style>
</head>
<body>
<main>
  <h1>公文 PDF → Markdown</h1>
  <p class="sub">掃描的台灣公文轉成帶 YAML frontmatter 的 Markdown，正文逐頁標記頁碼。</p>

  <div class="card">
    <div id="drop">
      <strong>把 PDF 拖到這裡</strong>
      <span id="hint">或點一下選擇檔案</span>
    </div>
    <input type="file" id="file" accept="application/pdf,.pdf" hidden>
    <div class="row">
      <label for="model">模型</label>
      <input type="text" id="model" placeholder="載入中…">
      <button id="go" disabled>開始轉換</button>
    </div>
  </div>

  <div class="card" id="status">
    <div id="msg">準備中…</div>
    <div class="bar"><i></i></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="card" id="result">
    <div class="row" style="margin-top:0; justify-content: space-between;">
      <strong id="outname"></strong>
      <span>
        <button class="ghost" id="copy">複製</button>
        <button id="download">下載 .md</button>
      </span>
    </div>
    <pre id="out"></pre>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let file = null, busy = false;

fetch("/api/config").then(r => r.json()).then(cfg => {
  $("model").value = cfg.model;
  $("hint").textContent = `或點一下選擇檔案（單份上限 ${cfg.maxPages} 頁、${cfg.maxUploadMB}MB）`;
}).catch(() => { $("model").placeholder = "gpt-5"; });

function pick(f) {
  if (!f) return;
  if (!/\.pdf$/i.test(f.name)) { showError("只接受 .pdf 檔"); return; }
  file = f;
  $("drop").innerHTML = `<strong>${escapeHtml(f.name)}</strong><span>${(f.size / 1024 / 1024).toFixed(1)} MB — 換一個檔案就再拖一次</span>`;
  $("go").disabled = busy;
}

$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => pick(e.target.files[0]);
["dragenter", "dragover"].forEach(ev => $("drop").addEventListener(ev, (e) => {
  e.preventDefault(); $("drop").classList.add("over");
}));
["dragleave", "drop"].forEach(ev => $("drop").addEventListener(ev, (e) => {
  e.preventDefault(); $("drop").classList.remove("over");
}));
$("drop").addEventListener("drop", (e) => pick(e.dataTransfer.files[0]));

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function showError(msg) {
  $("status").classList.add("on");
  $("msg").innerHTML = `<span class="err">${escapeHtml(msg)}</span>`;
  $("meta").textContent = "";
  document.querySelector(".bar").style.display = "none";
}

$("go").onclick = async () => {
  if (!file || busy) return;
  busy = true;
  $("go").disabled = true;
  $("result").classList.remove("on");
  $("status").classList.add("on");
  document.querySelector(".bar").style.display = "";
  $("msg").textContent = "上傳中…";
  $("meta").textContent = "";

  const t0 = Date.now();
  let chars = 0;
  const renderMeta = () => {
    const secs = ((Date.now() - t0) / 1000).toFixed(0);
    $("meta").textContent = chars ? `已輸出 ${chars} 字 — ${secs} 秒` : `${secs} 秒`;
  };
  const tick = setInterval(renderMeta, 1000);

  try {
    const qs = new URLSearchParams({ name: file.name, model: $("model").value.trim() });
    const res = await fetch(`/api/convert?${qs}`, {
      method: "POST",
      headers: { "content-type": "application/pdf" },
      body: file,
    });
    if (!res.ok || !res.headers.get("content-type")?.includes("text/event-stream")) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || `伺服器回應 ${res.status}`);
    }

    // EventSource 不支援 POST，所以自己切 SSE 的 \n\n 區塊。
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let done = null, error = null;
    while (true) {
      const { value, done: fin } = await reader.read();
      if (fin) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i);
        buf = buf.slice(i + 2);
        if (!block.startsWith("data: ")) continue;   // 心跳的 ":" 略過
        const ev = JSON.parse(block.slice(6));
        if (ev.type === "status") { $("msg").textContent = ev.msg; }
        else if (ev.type === "progress") { chars = ev.chars; renderMeta(); }
        else if (ev.type === "done") { done = ev; }
        else if (ev.type === "error") { error = ev.msg; }
      }
    }
    if (error) throw new Error(error);
    if (!done) throw new Error("連線中斷，沒有收到結果");

    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    $("status").classList.remove("on");
    $("result").classList.add("on");
    $("outname").textContent = `${done.filename}（${secs} 秒）`;
    $("out").textContent = done.markdown;
    $("download").onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([done.markdown], { type: "text/markdown" }));
      a.download = done.filename;
      a.click();
      URL.revokeObjectURL(a.href);
    };
    $("copy").onclick = async () => {
      await navigator.clipboard.writeText(done.markdown);
      $("copy").textContent = "已複製";
      setTimeout(() => ($("copy").textContent = "複製"), 1500);
    };
  } catch (e) {
    showError(e.message);
  } finally {
    clearInterval(tick);
    busy = false;
    $("go").disabled = !file;
  }
};
</script>
</body>
</html>
