[project]
name = "official-doc-parser"
version = "0.1.0"
description = "Taiwan official-document PDF to Markdown parser"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
# PyMuPDF 是 AGPL-3.0（或 Artifex 商業授權），只給雲端版用；地端版與其 Windows exe 改用
# pypdfium2（Apache-2.0／BSD-3-Clause），exe 不含 PyMuPDF。
cloud = [
    "anthropic",
    "google-genai>=2.24.0",
    "openai",
    "pymupdf",
]
local = [
    "accelerate==1.12.0",
    "beautifulsoup4",
    "einops==0.8.1",
    "numpy",
    "open-clip-torch==3.2.0",
    "opencv-python-headless",
    "pillow",
    "pypdfium2",
    "timm==1.0.22",
    "torch",
    "torchvision",
    "transformers==5.6.1",
]
bench = [
    "opencc-python-reimplemented",
]
exe = [
    "pyinstaller",
]

[tool.uv]
package = false

# Windows 的 PyPI torch 只有 CPU 版；Windows 改從 PyTorch 官方 CUDA 13.0 index 安裝
# （支援 Turing 到 Blackwell，驅動需 R580 以上）。Linux 維持 PyPI。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
